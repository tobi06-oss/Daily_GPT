name: Deploy Daily GPT
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Bundle NanumSquare fonts locally
        run: |
          mkdir -p public/fonts
          curl -fL --retry 3 --retry-delay 2 https://raw.githubusercontent.com/han41858/NanumSquare/master/NanumSquareR.ttf -o public/fonts/NanumSquareR.ttf
          curl -fL --retry 3 --retry-delay 2 https://raw.githubusercontent.com/han41858/NanumSquare/master/NanumSquareB.ttf -o public/fonts/NanumSquareB.ttf
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
